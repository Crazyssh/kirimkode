    <rect x="200" y="1220" width="680" height="84" rx="42" fill="#1E293B" stroke="#334155"/>
    <text x="540" y="1273" text-anchor="middle" fill="#E2E8F0">⚡ OTP masuk hitungan detik</text>
    <rect x="200" y="1324" width="680" height="84" rx="42" fill="#1E293B" stroke="#334155"/>
