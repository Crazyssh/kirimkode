  <polygon points="540,420 487,512 535,512 540,580 593,488 545,488" fill="url(#bolt3)"/>
  <circle cx="540" cy="498" r="9" fill="#1E293B"/>
  <polygon points="535,505 540,522 545,505" fill="#1E293B"/>

