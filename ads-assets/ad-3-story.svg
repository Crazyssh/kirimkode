  <!-- CTA -->
  <rect x="240" y="1620" width="600" height="96" rx="48" fill="#00E676"/>
  <text x="540" y="1682" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="44" font-weight="700" fill="#0B1120">kirimkode.com</text>

