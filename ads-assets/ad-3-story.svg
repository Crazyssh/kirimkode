  <text x="540" y="1020" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="120" font-weight="700" fill="#00E676" letter-spacing="-4">Rp1.000</text>

  <text x="540" y="1110" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="40" fill="#94A3B8">WA · Telegram · Shopee · DANA · 100+</text>

