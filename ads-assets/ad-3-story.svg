<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1080" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="50%" stop-color="#15233f"/><stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="bolt3" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="g3"><feGaussianBlur stdDeviation="60" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg3)"/>
  <circle cx="540" cy="560" r="220" fill="#00E676" opacity="0.10" filter="url(#g3)"/>

  <!-- icon -->
