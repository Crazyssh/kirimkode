    <rect x="200" y="1428" width="680" height="84" rx="42" fill="#1E293B" stroke="#334155"/>
    <text x="540" y="1481" text-anchor="middle" fill="#E2E8F0">💳 Bayar QRIS mulai Rp1.000</text>
