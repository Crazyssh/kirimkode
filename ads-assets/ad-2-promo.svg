<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#13203a"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="bolt2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00E676"/><stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="50" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg2)"/>
  <circle cx="540" cy="540" r="260" fill="#00E676" opacity="0.07" filter="url(#g2)"/>

  <!-- top brand row -->
  <rect x="380" y="90" width="76" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <polygon points="418,102 401,132 416,132 418,154 435,122 420,122" fill="url(#bolt2)"/>
  <text x="474" y="146" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="48" font-weight="700">
    <tspan fill="#E2E8F0">Kirim</tspan><tspan fill="#00E676">Kode</tspan>
  </text>

  <!-- big number -->
  <text x="540" y="470" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="240" font-weight="700" fill="#00E676" letter-spacing="-8">1RB</text>
  <text x="540" y="540" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="40" fill="#94A3B8">harga nokos termurah</text>

  <!-- headline -->
  <text x="540" y="660" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="70" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Verifikasi OTP</text>
  <text x="540" y="740" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="70" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Tanpa Ribet</text>

  <!-- checklist -->
  <g font-family="'Inter','Segoe UI',sans-serif" font-size="32" fill="#CBD5E1">
    <text x="300" y="830">✓  OTP masuk dalam hitungan detik</text>
    <text x="300" y="885">✓  100+ aplikasi didukung</text>
    <text x="300" y="940">✓  Refund otomatis kalau gagal</text>
  </g>

  <!-- CTA -->
  <rect x="300" y="980" width="480" height="74" rx="37" fill="#00E676"/>
  <text x="540" y="1029" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="36" font-weight="700" fill="#0B1120">Daftar → kirimkode.com</text>
</svg>
